<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case File: The Missing Quiz Cards</title>
<style>
  :root{
    --bg:#f3f0e8; --card:#ffffff; --ink:#1d2430; --muted:#5d6675; --line:#ddd6c8;
    --accent:#1f3a5f; --accent2:#c8553d; --hl:#ffe9a8;
    --ok:#2e7d4f; --okbg:#e7f4ec; --no:#b3392f; --nobg:#fbeae7;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  header{background:var(--accent);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:1.05rem;margin:0}
  header .tag{font-family:ui-monospace,Consolas,monospace;font-size:.72rem;opacity:.75;display:block;letter-spacing:.08em}
  .hctl{display:flex;gap:6px;flex-wrap:wrap}
  .toggle{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.83rem;font-family:inherit}
  .toggle.on{background:#fff;color:var(--accent);font-weight:700}
  .wrap{max-width:860px;margin:0 auto;padding:18px 16px 48px}
  .steps{display:flex;gap:6px;margin-bottom:8px}
  .step{flex:1;text-align:center;font-size:.75rem;padding:6px 2px;border:none;border-bottom:3px solid var(--line);color:var(--muted);background:transparent;font-family:inherit}
  .step.done{border-color:var(--ok);color:var(--ok)}
  .step.now{border-color:var(--accent2);color:var(--ink);font-weight:700}
  .step.can{cursor:pointer}
  .step.can:hover{background:rgba(31,58,95,.06)}
  .step:disabled{cursor:default}
  .prog{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:.78rem;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
  .bar{flex:1;height:6px;background:#e4ded1;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .label{font-family:ui-monospace,Consolas,monospace;font-size:.75rem;color:var(--accent2);letter-spacing:.06em}
  h2{margin:4px 0 6px;font-size:1.3rem}
  .inst{margin:0 0 14px;color:var(--muted);font-size:.95rem}
  .ctx{background:#faf8f3;border-left:4px solid var(--accent);padding:12px 14px;border-radius:6px;margin:10px 0 14px;font-size:1.05rem}
  .ctxrow{display:flex;gap:10px;align-items:flex-start}
  .ctxrow > div{flex:1}
  .prompt{font-weight:700;margin:6px 0 4px;font-size:1.05rem}
  .ko{display:none;color:var(--muted);font-size:.9rem;margin-top:4px}
  .koi{display:none;color:var(--muted);font-size:.82rem}
  body.show-ko .ko{display:block}
  body.show-ko .koi{display:inline}
  .opt .ko{font-weight:400;font-size:.88rem;margin-top:2px}
  .qcount{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;color:var(--muted)}
  .opts{display:grid;gap:8px;margin:12px 0}
  .optrow{display:flex;gap:6px;align-items:stretch}
  .optrow .opt{flex:1}
  .optrow .spk{height:auto;min-height:44px}
  .opt{text-align:left;padding:12px 14px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:1rem;cursor:pointer;color:var(--ink);font-family:inherit}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt.right{border-color:var(--ok);background:var(--okbg);font-weight:700}
  .opt.wrong{border-color:var(--no);background:var(--nobg);text-decoration:line-through;opacity:.75}
  .opt:disabled{cursor:default}
  .spk{border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;cursor:pointer;flex-shrink:0;font-size:1rem;line-height:1;padding:0}
  .spk:hover{border-color:var(--accent);background:#eef2f7}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .row.end{justify-content:flex-end}
  .row.nav{justify-content:space-between;margin-top:14px}
  button.primary{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:.98rem;cursor:pointer;font-family:inherit}
  button.primary:hover{opacity:.9}
  button.primary:disabled{opacity:.4;cursor:default}
  button.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:.88rem;cursor:pointer;font-family:inherit}
  button.ghost.sel{border-color:var(--accent);color:var(--accent);font-weight:700}
  button.back{font-size:.82rem;padding:5px 10px;color:var(--muted)}
  .hint{display:none;background:#fff8e3;border:1px dashed #e0c36a;padding:8px 12px;border-radius:8px;font-size:.92rem;margin-top:8px}
  .fb{margin-top:10px;border-radius:8px;font-size:.95rem}
  .fb.ok{background:var(--okbg);color:#1f5a38;padding:10px 12px}
  .fb.no{background:var(--nobg);color:#7d241c;padding:10px 12px}
  mark{background:var(--hl);padding:0 3px;border-radius:3px;font-weight:700}
  mark[data-say]{cursor:pointer}
  u{text-decoration-color:var(--no);text-decoration-thickness:2px}
  .passage{font-size:1.06rem;line-height:1.8}
  .sent{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;transition:background .2s}
  .sent > div{flex:1}
  .sent.playing{background:#fff1c2}
  .w{background:none;border:none;border-bottom:1.5px dotted var(--accent);padding:0;font:inherit;color:inherit;cursor:pointer;line-height:1.4}
  .w:hover{background:#eef2f7}
  .wordbox{margin-top:10px;padding:8px 12px;background:#fff;border:1px dashed #c9d3e0;border-radius:8px;font-size:.93rem;color:var(--muted);min-height:40px}
  .wordbox b{color:var(--accent);margin-right:6px}
  .suspects{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
  .sus{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
  .sus .spk{float:right;width:30px;height:30px;font-size:.9rem}
  .sus b{display:block;font-size:1.02rem}
  .sus span{font-size:.92rem}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:8px 0}
  .mode{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .mode b{display:block;font-size:1.02rem;margin-bottom:2px}
  .mode span{font-size:.88rem;color:var(--muted)}
  .mode.sel{border-color:var(--accent);background:#f2f5fa}
  .gloss{margin:4px 0 12px}
  .gpanel{margin-top:8px;border:1px solid #d3dbe6;background:#f5f8fc;border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
  .gpanel[hidden]{display:none}
  .gitem{background:#fff;border-radius:8px;padding:8px 10px;font-size:.9rem;border:1px solid #e3e8ef}
  .gitem .spk{float:right;width:28px;height:28px;font-size:.85rem}
  .gitem b{display:block;color:var(--accent)}
  .gitem em{display:block;font-style:normal;color:var(--muted);font-size:.84rem}
  .board{margin-top:16px}
  .board h3{font-size:.85rem;font-family:ui-monospace,Consolas,monospace;color:var(--muted);margin:0 0 8px;letter-spacing:.06em}
  .clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
  .clue{border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem;color:var(--muted);background:rgba(255,255,255,.5)}
  .clue.open{border-style:solid;border-color:var(--accent2);background:#fff;color:var(--ink)}
  .clue .n{font-family:ui-monospace,Consolas,monospace;font-size:.72rem;color:var(--accent2);display:block}
  .unlock{text-align:center;padding:18px 6px}
  .unlock .big{font-size:1.15rem;font-weight:700;margin:10px 0 4px}
  .frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px;margin:8px 0}
  .frame{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.93rem;font-family:inherit;color:var(--ink)}
  .frame:hover{border-color:var(--accent)}
  .frame.used{border-color:var(--ok);background:var(--okbg)}
  .frame .ko{font-size:.82rem;margin-top:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;font-size:.88rem;align-items:center;color:var(--muted)}
  .chip{background:#eef2f7;border:1px solid #d3dbe6;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:.88rem;font-family:inherit;color:var(--ink)}
  .pill{display:inline-block;background:var(--hl);border-radius:6px;padding:2px 8px;margin:2px;font-size:.88rem;font-weight:600}
  textarea{width:100%;font-size:1.05rem;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;line-height:1.6;resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}
  .preview{background:#faf8f3;padding:10px 12px;border-radius:8px;margin:8px 0;font-size:1.02rem}
  ul.msgs{margin:6px 0 0;padding-left:20px}
  .selfcheck{border:1px solid #d3dbe6;background:#f5f8fc;border-radius:10px;padding:10px 12px;margin-top:10px}
  .selfcheck label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:.93rem;cursor:pointer}
  .selfcheck input{margin-top:5px;width:18px;height:18px;flex-shrink:0}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}
  td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
  th{font-size:.8rem;color:var(--muted)}
  td .spk{width:28px;height:28px;font-size:.85rem}
  .stat{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .stat div{background:#faf8f3;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .stat b{font-size:1.3rem;display:block}
  .bonus{border:2px solid var(--accent2);border-radius:12px;padding:14px;margin-top:16px;background:#fff7f4}
  @media (max-width:560px){ .step{font-size:.66rem} .card{padding:16px} }
</style>
</head>
<body>
<header>
  <div>
    <span class="tag">CASE FILE #08 · SCHOOL FESTIVAL</span>
    <h1>The Missing Quiz Cards</h1>
  </div>
  <div class="hctl">
    <button class="toggle" id="rateBtn">속도: 보통</button>
    <button class="toggle" id="helpBtn">도움 모드</button>
    <button class="toggle" id="koToggle">문장 해석 보기</button>
  </div>
</header>

<div class="wrap">
  <div class="steps" id="steps"></div>
  <div class="prog"><span id="progTxt">진행 0 / 18</span><div class="bar"><i id="progBar"></i></div></div>
  <main class="card" id="main"></main>
  <section class="board" id="board"></section>
</div>

<script>
/* ================= 상태 ================= */
const S = {
  max:0, clues:[false,false,false,false], qs:{},
  draft:'', sentence:'', used:[], writePassed:false,
  bonusDraft:'', bonusDone:false,
  glossOpen:false, help:false, rate:0.9,
  rerender:null
};
const STEPS = ['사건','읽기','의미','형태','활용','쓰기','해결'];
const MAIN_KEYS = ['read','meaning','form','use','solve'];

/* ================= 음성(TTS) ================= */
const TTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
let voice = null, playToken = 0;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /Google|Samantha|Microsoft|Natural/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang))
       || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(TTS){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(text, onend, chain){
  if(!TTS || !text) return;
  if(!chain) playToken++;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; if(voice) u.voice = voice; u.rate = S.rate;
  if(onend) u.onend = onend;
  speechSynthesis.speak(u);
}
function stopAll(){
  playToken++;
  if(TTS) speechSynthesis.cancel();
  document.querySelectorAll('.sent').forEach(r=>r.classList.remove('playing'));
}
function playAll(){
  if(!TTS) return;
  const t = ++playToken;
  const rows = [...document.querySelectorAll('.sent')];
  let i = 0;
  const next = ()=>{
    rows.forEach(r=>r.classList.remove('playing'));
    if(t !== playToken || i >= rows.length) return;
    const r = rows[i++];
    r.classList.add('playing');
    r.scrollIntoView({block:'nearest',behavior:'smooth'});
    speak(r.dataset.line, next, true);
  };
  next();
}

/* ================= 유틸 ================= */
const main = document.getElementById('main');
const esc  = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const attr = s => s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function plain(html){
  const d = document.createElement('div'); d.innerHTML = html || '';
  return d.textContent.replace(/_{2,}/g,' blank ').replace(/\s+/g,' ').trim();
}
function sayBtn(text){
  return TTS && text ? `<button class="spk" data-say="${attr(text)}" title="듣기" aria-label="듣기">🔊</button>` : '';
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const W = (w,k)=>`<button class="w" data-k="${attr(k)}">${w}</button>`;
const M = e=>`<mark data-say="${e}">${e}</mark>`;

/* ================= 콘텐츠 ================= */
const EXPR = [
  {e:'in charge of',      k:'~을 책임지는, 담당하는',          ex:'Mina is in charge of the booth.'},
  {e:'take part in',      k:'~에 참여하다',                    ex:'Everyone took part in the game.'},
  {e:'figure out',        k:'(생각해서) 알아내다, 해결하다',    ex:'I figured out the answer.'},
  {e:'work on',           k:'~에 공들이다, ~을 작업하다',       ex:'We are working on a poster.'},
  {e:'cut down on',       k:'~을 줄이다',                      ex:'Let\'s cut down on snacks.'},
  {e:'make a difference', k:'변화를 가져오다, 좋은 영향을 주다', ex:'Small changes make a difference.'}
];

const SUSPECTS = [
  {n:'Mina', d:'is <b>in charge of</b> the English booth.', k:'영어 부스를 책임지고 있다.'},
  {n:'Jun',  d:'<b>worked on</b> the posters.', k:'포스터 작업을 했다.'},
  {n:'Sora', d:'<b>took part in</b> testing the game.', k:'게임 테스트에 참여했다.'},
  {n:'Theo', d:'<b>figured out</b> the mystery theme.', k:'미스터리 테마를 생각해 냈다.'}
];

const CLUES = [
  {t:'The person with the cards is <b>NOT in charge of</b> the booth.', k:'카드를 가진 사람은 부스 책임자가 아니다.'},
  {t:'The person with the cards did <b>NOT work on</b> the posters.', k:'카드를 가진 사람은 포스터 작업을 하지 않았다.'},
  {t:'The person took the cards to <b>cut down on</b> the long instructions.', k:'그 사람은 긴 설명을 줄이려고 카드를 가져갔다.'},
  {t:'This person <b>took part in</b> testing the game. That\'s when they saw the problem.', k:'이 사람은 게임 테스트에 참여했다. 그때 문제를 발견했다.'}
];

/* 본문: 문장 단위 + 어려운 단어(점선) 뜻 */
const SENTS = [
  { en:`Our class is ${W('preparing','준비하는 중인')} for the school ${W('festival','축제')}.`,
    ko:'우리 반은 학교 축제를 준비하고 있다.' },
  { en:`Mina is ${M('in charge of')} the English ${W('booth','부스 (행사장의 작은 공간)')}.`,
    ko:'미나는 영어 부스를 맡고 있다.' },
  { en:`She ${W('asked','부탁했다')} everyone to ${M('take part in')} a short quiz game.`,
    ko:'미나는 모두에게 짧은 퀴즈 게임에 참여해 달라고 부탁했다.' },
  { en:`${W('At first','처음에는')}, the team could not ${M('figure out')} how to make the ${W('activity','활동')} ${W('interesting','재미있는')}.`,
    ko:'처음에 팀은 활동을 재미있게 만드는 방법을 알아내지 못했다.' },
  { en:`They ${W('decided','결정했다')} to ${M('work on')} a ${W('mystery','미스터리, 수수께끼')} ${W('theme','주제, 테마')}.`,
    ko:'그들은 미스터리 테마로 작업하기로 했다.' },
  { en:`After ${W('testing','시험해 보기')} the game, they decided to ${M('cut down on')} long ${W('instructions','설명, 안내문')}.`,
    ko:'게임을 테스트한 후, 그들은 긴 설명을 줄이기로 했다.' },
  { en:`They ${W('hope','바라다')} these ${W('changes','변화들')} will ${M('make a difference')} for the students who ${W('visit','방문하다')} the booth.`,
    ko:'그들은 이 변화가 부스를 찾는 학생들에게 좋은 영향을 주기를 바란다.' }
];

/* STEP 1 */
const READ_QS = [
  { prompt:'After testing the game, what did the team change?',
    promptKo:'게임을 테스트한 후, 팀은 무엇을 바꾸었나요?',
    hint:'본문의 끝에서 두 번째 문장을 다시 들어 보세요. "After testing the game..."',
    explain:'본문에 <b>they decided to cut down on long instructions</b>라고 나와요.',
    options:[
      {t:'They made the instructions shorter.', k:'설명을 더 짧게 만들었다.', ok:true},
      {t:'They added more instructions.', k:'설명을 더 추가했다.', why:'반대예요. 설명을 더 늘린 게 아니라 줄였어요.'},
      {t:'They stopped the quiz game.', k:'퀴즈 게임을 그만두었다.', why:'게임을 그만둔 게 아니라, 게임의 한 부분을 바꿨어요.'}
    ]}
];

/* STEP 2 */
const MEANING_QS = [
  { ctx:'Mina is <mark>in charge of</mark> the English booth.', ctxKo:'미나는 영어 부스를 ______.',
    prompt:'What does <b>in charge of</b> mean here?',
    hint:'미나는 모두에게 퀴즈에 참여해 달라고 부탁하는 사람이에요. 부스에서 어떤 역할일까요?',
    explain:'<b>in charge of</b> = ~을 책임지는, 담당하는. 미나는 부스의 책임자예요.',
    options:[
      {t:'responsible for something; the leader of it', k:'어떤 일을 책임지는; 그 일의 리더인', ok:true},
      {t:'paying money for something', k:'어떤 것에 돈을 내는', why:'charge에 "요금"이라는 뜻도 있지만, 여기서는 부스를 "맡고 있다"는 뜻이에요.'},
      {t:'worried about something', k:'어떤 것을 걱정하는', why:'미나가 걱정한다는 내용은 본문에 없어요. 미나가 하는 일을 생각해 보세요.'}
    ]},
  { ctx:'She asked everyone to <mark>take part in</mark> a short quiz game.', ctxKo:'미나는 모두에게 짧은 퀴즈 게임에 ______ 달라고 부탁했다.',
    prompt:'What does <b>take part in</b> mean here?',
    hint:'퀴즈 게임을 만들었으면 사람들이 무엇을 해 주길 바랄까요?',
    explain:'<b>take part in</b> = ~에 참여하다. 세 단어를 한 덩어리로 기억하세요.',
    options:[

function analyze(t){
  return {
    found: PAT.filter(p=>p.re.test(t)).map(p=>p.name),
    errs: ERR.filter(e=>e.re.test(t)).map(e=>e.tip)
  };
}
function highlight(t){
  let h = esc(t);
  PAT.forEach(p=>{ h = h.replace(new RegExp(p.re.source,'gi'), m=>`<mark>${m}</mark>`); });
  return h;
}

/* ================= 공통 UI ================= */
function updateProgress(){
  let done = S.writePassed ? 1 : 0;
  MAIN_KEYS.forEach(k=>{ (S.qs[k]||[]).forEach(x=>{ if(x.solved) done++; }); });
  document.getElementById('progTxt').textContent = `진행 ${done} / ${TOTAL}`;
  document.getElementById('progBar').style.width = (done/TOTAL*100) + '%';
}

function setStep(n){
  stopAll();
  S.max = Math.max(S.max, n);
  document.getElementById('steps').innerHTML = STEPS.map((s,i)=>{
    const can = i <= S.max && i !== n;
    return `<button class="step ${i<n?'done':''} ${i===n?'now':''} ${can?'can':''}" data-step="${i}" ${can?'':'disabled'}>${s}</button>`;
  }).join('');
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderBoard(){
  document.getElementById('board').innerHTML = `<h3>CLUE BOARD</h3><div class="clues">${
    CLUES.map((c,i)=> S.clues[i]
      ? `<div class="clue open"><span class="n">CLUE ${i+1}</span>${c.t}<div class="ko">${c.k}</div></div>`

/* ================= 퀴즈 엔진 ================= */
function runQuiz(key, qs, mount, onDone){
  const st = S.qs[key] || (S.qs[key] = qs.map(q=>({ wrong:[], removed:[], solved:false, order:shuffle(q.options.map((_,i)=>i)) })));
  let i = st.findIndex(x=>!x.solved); if(i < 0) i = 0;

  function render(){
    const q = qs[i], s = st[i];
    const th = S.help ? 1 : 2;                      // 도움 모드: 한 번 틀리면 힌트
    const autoHint = s.wrong.length >= th && !s.solved;
    const sayText = plain((q.ctx||'') + ' ' + q.prompt);
    const wrongLeft = q.options.map((_,idx)=>idx).filter(idx=>!q.options[idx].ok && !s.wrong.includes(idx) && !s.removed.includes(idx));
    const canReduce = !s.solved && s.removed.length===0 && wrongLeft.length >= 2;

    const optsHTML = s.order.filter(idx=>!s.removed.includes(idx)).map(idx=>{
      const o = q.options[idx];
      let cls = '';
      if(s.wrong.includes(idx)) cls = 'wrong';
      if(s.solved && o.ok) cls = 'right';
      const dis = s.solved || s.wrong.includes(idx);
      const btn = `<button class="opt ${cls}" data-i="${idx}" ${dis?'disabled':''}>${o.t}${o.k?`<span class="ko">${o.k}</span>`:''}</button>`;
      return (S.help && TTS) ? `<div class="optrow">${sayBtn(plain(o.t))}${btn}</div>` : btn;
    }).join('');

    mount.innerHTML = `
      <div class="qcount">Q ${i+1} / ${qs.length}</div>
      ${q.ctx ? `<div class="ctx"><div class="ctxrow">${sayBtn(sayText)}<div>${q.ctx}${q.ctxKo?`<div class="ko">${q.ctxKo}</div>`:''}</div></div></div>` : ''}
      <div class="ctxrow">${q.ctx?'':sayBtn(sayText)}<div><p class="prompt">${q.prompt}</p>${q.promptKo?`<div class="ko">${q.promptKo}</div>`:''}</div></div>
      <div class="opts">${optsHTML}</div>
      <div class="row">
        ${q.hint?'<button class="ghost hintbtn">힌트 보기</button>':''}
        ${canReduce?'<button class="ghost reduce">선택지 하나 지우기</button>':''}
      </div>
      ${q.hint?`<div class="hint" style="${autoHint?'display:block':''}">${q.hint}</div>`:''}
      <div class="fb ${s.solved?'ok':''}">${s.solved?`<b>정답!</b> ${q.explain||''}`:''}</div>
      <div class="row nav">
        <span>${i>0?'<button class="ghost prev">← 이전 문제</button>':''}</span>
        <button class="primary next" ${s.solved?'':'hidden'}>${i<qs.length-1?'다음 문제 →':'완료 →'}</button>
      </div>`;

    const hb = mount.querySelector('.hintbtn');
    if(hb) hb.onclick = ()=>{ mount.querySelector('.hint').style.display='block'; };

    const rd = mount.querySelector('.reduce');
    if(rd) rd.onclick = ()=>{
      const pick = wrongLeft[Math.floor(Math.random()*wrongLeft.length)];
      s.removed.push(pick); render();
    };

    mount.querySelectorAll('.opt').forEach(b=> b.onclick = ()=>{
      if(s.solved) return;
      const idx = +b.dataset.i, o = q.options[idx];
      const fb = mount.querySelector('.fb');
      if(o.ok){
        s.solved = true;
        render();
        updateProgress();
      } else {
        if(!s.wrong.includes(idx)) s.wrong.push(idx);
        render();
        const fb2 = mount.querySelector('.fb');
        fb2.className='fb no'; fb2.innerHTML = `<b>다시 생각해 볼까요?</b> ${o.why||'상황을 다시 읽어 보세요.'}`;
      }
    });

    const pv = mount.querySelector('.prev');
    if(pv) pv.onclick = ()=>{ i--; render(); };
    mount.querySelector('.next').onclick = ()=>{ i++; if(i < qs.length) render(); else onDone(); };
  }
  render();
}

function score(){
  let total=0, first=0;
  MAIN_KEYS.forEach(k=>(S.qs[k]||[]).forEach(x=>{ if(x.solved){ total++; if(x.wrong.length===0) first++; } }));
  return {total, first};
}

function checkWriting(t){
  const box = document.getElementById('wfb');
  const msgs = [];
  if(!t){ box.innerHTML = `<div class="fb no">문장을 먼저 써 주세요.</div>`; return; }
  if(t.includes('__')) msgs.push('빈칸(____)을 내 생각으로 채워 주세요. 아이디어 단어를 눌러도 돼요.');
  const {found, errs} = analyze(t);
  const sentences = t.split(/[.!?\n]+/).map(x=>x.trim()).filter(x=>x.split(/\s+/).length >= 3);
  if(found.length < 2) msgs.push(`<b>서로 다른</b> 목표 표현을 2개 이상 써 주세요. (지금 ${found.length}개)`);
  if(sentences.length < 2) msgs.push('문장을 2개 써 주세요. 문장 끝에 마침표(.)를 찍었는지도 확인하세요.');
  errs.forEach(e=>msgs.push(e));

  const usedLine = found.length ? `사용한 표현: ${found.map(f=>`<span class="pill">${f}</span>`).join('')}` : '';
  if(msgs.length){
    box.innerHTML = `
      <div class="preview">${highlight(t)}</div>
      <div style="font-size:.9rem">${usedLine}</div>
      <div class="fb no"><b>조금만 고쳐 볼까요?</b><ul class="msgs">${msgs.map(m=>`<li>${m}</li>`).join('')}</ul></div>`;
    return;
  }

  const model = document.getElementById('modelHolder').innerHTML;
  box.innerHTML = `
    <div class="fb ok"><b>형태는 정확해요!</b> 이제 뜻이 상황에 맞는지 스스로 확인해 보세요.</div>
    <div class="preview">${highlight(t)}</div>
    <div class="selfcheck">
      <b style="font-size:.92rem">내 문장 점검하기</b>
      ${found.map(f=>`<label><input type="checkbox" class="sc"> <span>${SELF[f]}</span></label>`).join('')}

    </div>
    <div class="row"><button class="ghost" id="model">예시 문장 보기</button></div>
    <div class="hint" id="modelBox"><div class="ctxrow">${sayBtn(plain(model))}<div>${model}
      <div class="ko">나는 음악을 맡고 있다. 사람들이 퀴즈를 들어야 하니까 소음을 줄여야 한다.</div></div></div></div>
    <div class="row end"><button class="primary" id="go" disabled>단서 받기 →</button></div>`;
  const go = document.getElementById('go');
  const boxes = box.querySelectorAll('.sc');
  boxes.forEach(b=> b.onchange = ()=>{ go.disabled = ![...boxes].every(x=>x.checked); });
  document.getElementById('model').onclick = ()=>{ document.getElementById('modelBox').style.display='block'; };
  go.onclick = ()=>{
    S.sentence = t; S.used = found; S.writePassed = true; updateProgress();
    unlockClue(3, 5, showSolve);
  };
}

    </div>
    <p class="prompt" style="margin-top:18px">오늘의 표현 정리</p>
    <table><tr><th></th><th>Expression</th><th>뜻</th><th>본문 속 문장</th></tr>
      ${rows.map(r=>`<tr><td>${sayBtn(r[0]+'. '+r[2])}</td><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
    </table>
    <div class="row end"><button class="ghost" id="again">처음부터 다시</button></div>`;
  document.getElementById('bonus').onclick = showBonus;
  document.getElementById('again').onclick = ()=>location.reload();
}

function showBonus(){
  stopAll(); S.rerender = showBonus;
  window.scrollTo({top:0,behavior:'smooth'});
  main.innerHTML = `
    <div class="topbar"><span class="label">BONUS CASE · 1/2</span>${backBtn(7,'← 결과로 돌아가기')}</div>
    <h2>소라의 카드 고치기</h2>
    <p class="inst">소라가 새로 쓴 카드에 실수가 있어요. 바르게 고친 문장을 고르세요.</p>
    ${glossBox()}
    <div id="quiz"></div>`;
  runQuiz('bonus', BONUS_QS, document.getElementById('quiz'), showBonusWrite);
}

function showBonusWrite(){
  stopAll(); S.rerender = showBonusWrite;
  window.scrollTo({top:0,behavior:'smooth'});
  const notUsed = EXPR.map(x=>x.e).filter(e=>!S.used.includes(e));
  const q = 'Write one sentence about the case. Use an expression you haven\'t used yet.';
  main.innerHTML = `
    <div class="topbar"><span class="label">BONUS CASE · 2/2</span>${backBtn(7,'← 결과로 돌아가기')}</div>
    <h2>마지막 도전</h2>
    <p class="inst">아직 써 보지 않은 표현 중 하나로 이번 사건에 대한 문장을 써 보세요.</p>
    ${glossBox()}
    <div class="ctx"><div class="ctxrow">${sayBtn(q)}<div>${q}
      <div class="ko">이번 사건에 대해 한 문장을 쓰세요. 아직 쓰지 않은 표현을 사용하세요.</div></div></div></div>
    <div style="font-size:.9rem;margin-bottom:6px">아직 안 쓴 표현: ${notUsed.map(e=>`<span class="pill">${e}</span>`).join('')}</div>
    <textarea id="bta" rows="3" placeholder="예: Sora figured out the problem with the cards."></textarea>
    <div class="row end"><button class="primary" id="bcheck">확인하기</button></div>
    <div id="bfb"></div>`;
  const ta = document.getElementById('bta');
  ta.value = S.bonusDraft;
  ta.oninput = ()=>{ S.bonusDraft = ta.value; };
  document.getElementById('bcheck').onclick = ()=>{
    const t = ta.value.trim(), box = document.getElementById('bfb');
    const {found, errs} = analyze(t);
    const fresh = found.filter(f=>notUsed.includes(f));
    const msgs = [];
    if(t.split(/\s+/).filter(Boolean).length < 5) msgs.push('조금 더 길게 써 보세요.');
    if(!fresh.length) msgs.push('아직 안 쓴 표현을 하나 사용해 주세요.');
    errs.forEach(e=>msgs.push(e));
    if(msgs.length){
      box.innerHTML = `<div class="preview">${highlight(t)}</div><div class="fb no"><ul class="msgs">${msgs.map(m=>`<li>${m}</li>`).join('')}</ul></div>`;
    } else {
      S.bonusDone = true;
      box.innerHTML = `<div class="preview">${highlight(t)}</div>
        <div class="fb ok"><b>훌륭해요, 탐정님!</b> 오늘 6개 표현 중 <b>${new Set([...S.used, ...fresh]).size}개</b>를 직접 써 봤어요.<br>
        <span style="font-size:.9rem">${SELF[fresh[0]]}</span></div>
        <div class="row end"><button class="primary" data-to="7">결과로 돌아가기</button></div>`;
    }
  };
}

const STAGES = [showIntro, showRead, showMeaning, showForm, showUse, showWrite, showSolve, showEnd];

/* ================= 공통 이벤트 ================= */
document.addEventListener('click', e=>{
  // 어려운 단어: 뜻 + 발음
  const w = e.target.closest('.w');
  if(w){
    const box = document.getElementById('wordbox');
    if(box) box.innerHTML = `<b>${w.textContent}</b>${w.dataset.k}`;
    speak(w.textContent);
    return;
  }
  // 듣기 버튼, 노란 표현
  const say = e.target.closest('[data-say]');
  if(say){ e.stopPropagation(); speak(say.dataset.say); return; }
}, true);

main.addEventListener('click', e=>{
  const to = e.target.closest('[data-to]');
  if(to){ STAGES[+to.dataset.to](); return; }
  if(e.target.id === 'glossBtn'){
    S.glossOpen = !S.glossOpen;
    document.getElementById('gpanel').hidden = !S.glossOpen;
    e.target.classList.toggle('sel', S.glossOpen);
    e.target.textContent = S.glossOpen ? '표현 뜻 닫기' : '표현 뜻 보기 (한국어 도움)';
  }
});
document.getElementById('steps').addEventListener('click', e=>{
  const b = e.target.closest('[data-step]');
  if(b && !b.disabled) STAGES[+b.dataset.step]();
});
document.getElementById('koToggle').onclick = ()=> setKo(!document.body.classList.contains('show-ko'));
document.getElementById('helpBtn').onclick = ()=> setHelp(!S.help);
const rateBtn = document.getElementById('rateBtn');
if(!TTS) rateBtn.style.display = 'none';
rateBtn.onclick = ()=>{
  S.rate = S.rate > 0.8 ? 0.65 : 0.9;
  rateBtn.classList.toggle('on', S.rate < 0.8);
  rateBtn.textContent = S.rate < 0.8 ? '속도: 천천히' : '속도: 보통';
};

renderBoard();
showIntro();
</script>
</body>
</html>
